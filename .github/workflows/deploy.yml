name: Deploy

# Manual on-demand deploy: runs unit tests, enforces the SonarCloud quality gate,
# and only on success builds+pushes the Docker image to GHCR and restarts the
# mcp-server container on the VPS. See the reusable workflow
# (dimasdom/SpreadScanner/.github/workflows/deploy-service.yml) for the full job
# graph and scripts/deploy-remote.sh for the VPS-side restart/rollback logic.
# No sibling repos needed — unlike ArbiScanner.TelegramNotifierApp, this service
# calls ArbiScannerWeb.API over plain HTTP with its own DTOs, no project references.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run tests/build/push but skip the VPS deploy step"
        type: boolean
        default: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: dimasdom/SpreadScanner/.github/workflows/deploy-service.yml@b518b63b996608834fde4b7bdd2f3fb67838c670 # master
    with:
      self_checkout_path: ArbiScanner.McpServer
      sonar_project_key: dimasdom_ArbiSpreadScanner.McpServer
      solution_file: ArbiScanner.McpServer.slnx
      unit_test_project: ArbiScanner.McpServer.Tests/ArbiScanner.McpServer.Tests.csproj
      sonar_begin_extra_args: >-
        /d:sonar.exclusions="**/Program.cs,**/ArbiScanner.McpServer.Domain/**,**/ArbiScanner.McpServer.Abstractions/Interfaces/**"
      sibling_repos: "[]"
      images: >-
        [{"name":"arbiscanner-mcp-server","dockerfile":"ArbiScanner.McpServer/Dockerfile","context":"ArbiScanner.McpServer","needs_root_checkout":false,"build_args":""}]
      deploy_services: "mcp-server"
      image_tag_vars: '{"mcp-server":"MCP_SERVER_IMAGE_TAG"}'
      dry_run: ${{ inputs.dry_run }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
